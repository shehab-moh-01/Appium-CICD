name: Appium Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Appium uiautomator2 driver
        run: |
          npx appium driver list --installed

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator image
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "emulator" "system-images;android-30;google_apis;x86_64"
          rm -rf "$ANDROID_AVD_HOME/ci-api30.avd" "$ANDROID_AVD_HOME/ci-api30.ini"
          printf 'no\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd --force --name ci-api30 --package "system-images;android-30;google_apis;x86_64" --abi x86_64 --device pixel_2
          test -f "$ANDROID_AVD_HOME/ci-api30.ini"
          test -d "$ANDROID_AVD_HOME/ci-api30.avd"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd

      - name: Run Appium tests on Android emulator
        run: bash run_tests.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-screenshot
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Appium diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-diagnostics
          path: |
            appium.log
            emulator.log
            emulator.log
            screenshots/logcat_failure.txt
            screenshots/page_source_*.xml
          if-no-files-found: warn
          retention-days: 14
